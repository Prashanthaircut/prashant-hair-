<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prashant Salon Admin - Secure</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding-bottom: 80px; }
        #lockScreen { position: fixed; top:0; left:0; width:100%; height:100%; background:#000; color:#d4af37; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; }
        #adminContent { display: none; }
        .header { background: #000; color: #d4af37; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
        .tab-content { display: none; padding: 15px; }
        .active-tab { display: block; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #fff; display: flex; border-top: 1px solid #ccc; }
        .nav-item { flex: 1; padding: 12px; text-align: center; cursor: pointer; color: #666; font-size: 14px; }
        .nav-item.active { color: #d4af37; border-top: 3px solid #d4af37; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-gold { background: #d4af37; color: #000; border: none; font-weight: bold; cursor: pointer; }
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-wa { background: #25D366; color: white; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-del { background: #ff4d4f; color: white; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; }
        .booking-box { background: #fffbe6; padding: 15px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #ffe58f; }
        .photo-list-item { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding: 10px 0; }
        .photo-list-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

<div id="lockScreen">
    <i class="fas fa-lock" style="font-size: 40px; margin-bottom: 20px;"></i>
    <h2>Admin Login</h2>
    <input type="password" id="passInput" placeholder="Enter Admin Password" style="width: 80%; text-align: center;">
    <button class="btn-gold" onclick="checkPass()" style="width: 80%;">Unlock Panel</button>
</div>

<div id="adminContent">
    <div class="header"><h2 style="margin:0;">PRASHANT ADMIN</h2></div>

    <div id="dashboard" class="tab-content active-tab">
        <div class="card">
            <h3>Shop Status & Notice</h3>
            <select id="statusSelect">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
            </select>
            <button class="btn-gold" onclick="updateStatus()">Update Status</button>
            <input type="text" id="announcementInput" placeholder="Offer Message">
            <button class="btn-gold" onclick="updateAnnouncement()">Update Notice</button>
        </div>
        <div class="card">
            <h3>Recent Bookings</h3>
            <div id="bookingList">Loading...</div>
        </div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card">
            <h3>Add Style Photo</h3>
            <input type="text" id="pUrl" placeholder="Image URL">
            <input type="text" id="pTitle" placeholder="Style Name">
            <input type="number" id="pPrice" placeholder="Price">
            <button class="btn-gold" onclick="addPhoto()">Add Photo</button>
        </div>
        <div class="card">
            <h3>Manage Styles</h3>
            <div id="adminPhotoList"></div>
        </div>
        <div class="card">
            <h3>Social Links</h3>
            <input type="text" id="waLink" placeholder="WhatsApp Number">
            <input type="text" id="igLink" placeholder="Instagram Link">
            <input type="text" id="tgLink" placeholder="Telegram Link">
            <button class="btn-gold" onclick="updateSocial()">Save Links</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="showTab('dashboard', this)"><i class="fas fa-list"></i><br>Bookings</div>
        <div class="nav-item" onclick="showTab('settings', this)"><i class="fas fa-cog"></i><br>Settings</div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "123"; 

    function checkPass() {
        const input = document.getElementById('passInput').value;
        if(input === ADMIN_PASSWORD) {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            loadAdminData();
        } else { alert("Wrong Password!"); }
    }

    const firebaseConfig = { databaseURL: "https://prashant-haircut-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function showTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active-tab');
        el.classList.add('active');
    }

    function loadAdminData() {
        db.ref('bookings').on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('bookingList');
            list.innerHTML = '';
            for(let id in data) {
                // FIXED: Direct WhatsApp Link with 91
                let customerPhone = data[id].phone;
                if(!customerPhone.startsWith('91')) customerPhone = '91' + customerPhone;

                list.innerHTML += `
                    <div class="booking-box">
                        <b>👤 ${data[id].name}</b><br>
                        📞 ${data[id].phone}<br>
                        ⏰ ${data[id].time.replace('T', ' ')}<br>
                        💬 ${data[id].note || '-'}<br>
                        <div class="action-btns">
                            <a href="https://wa.me/${customerPhone}" target="_blank" class="btn-wa"><i class="fab fa-whatsapp"></i> Chat</a>
                            <button class="btn-del" onclick="deleteBooking('${id}')"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                    </div>`;
            }
        });

        db.ref('photos').on('value', snap => {
            const data = snap.val();
            const list = document.getElementById('adminPhotoList');
            list.innerHTML = '';
            for(let id in data) {
                list.innerHTML += `<div class="photo-list-item"><img src="${data[id].url}"><div style="flex:1;"><b>${data[id].title}</b> - ₹${data[id].price}</div><button style="background:red; color:white; border:none; padding:5px;" onclick="deletePhoto('${id}')">X</button></div>`;
            }
        });
    }

    function deleteBooking(id) { if(confirm("Delete this booking?")) db.ref('bookings/' + id).remove(); }
    function deletePhoto(id) { if(confirm("Delete style?")) db.ref('photos/' + id).remove(); }
    function updateStatus() { db.ref('shopStatus').set(document.getElementById('statusSelect').value).then(()=>alert("Done")); }
    function updateAnnouncement() { db.ref('announcement').set(document.getElementById('announcementInput').value).then(()=>alert("Done")); }
    function addPhoto() {
        const u = document.getElementById('pUrl').value, t = document.getElementById('pTitle').value, p = document.getElementById('pPrice').value;
        if(u && t && p) db.ref('photos').push({url:u, title:t, price:p}).then(()=>alert("Added"));
    }
    function updateSocial() { db.ref('social').set({wa:document.getElementById('waLink').value, ig:document.getElementById('igLink').value, tg:document.getElementById('tgLink').value}).then(()=>alert("Saved")); }
</script>
</body>
</html>
