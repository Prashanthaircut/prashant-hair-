<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Admin - Prashant Hair Salon</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; }
        #loginBox { background: white; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 300px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-top: 4px solid #d4af37; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top:5px; }
        .note-box { background: #fff9c4; padding: 8px; border-radius: 6px; font-size: 12px; border-left: 3px solid #fbc02d; margin-top: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        td { padding: 10px 5px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h3 style="margin-bottom:15px;">Admin Entry</h3>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="checkPass()" style="background:#d4af37;">Login</button>
    </div>

    <div id="mainContent" style="display:none;">
        <h2 style="text-align:center; font-size: 1.3em;">Admin Control</h2>

        <div class="card" style="border-top-color: #ff9800;">
            <h3>📢 Notification Bar</h3>
            <input type="text" id="annMsg" placeholder="Offer message likhein...">
            <button onclick="updateNotice()" style="background:#ff9800;">Show on Website</button>
            <button onclick="clearNotice()" style="background:#666;">Remove Notice</button>
        </div>

        <div class="card" style="border-top-color: #3498db;">
            <h3>Update Social Links</h3>
            <input type="text" id="sTelegram" placeholder="Telegram Link">
            <input type="text" id="sInsta" placeholder="Instagram Link">
            <input type="text" id="sWA" placeholder="WhatsApp (91...)">
            <button onclick="updateSocial()" style="background:#3498db;">Update Links</button>
        </div>

        <div class="card">
            <h3>New Bookings</h3>
            <table><tbody id="bookBody"></tbody></table>
        </div>

        <div class="card" style="border-top-color: #27ae60;">
            <h3>Add Style</h3>
            <input type="text" id="pUrl" placeholder="Image URL">
            <input type="text" id="pTitle" placeholder="Style Name">
            <input type="number" id="pPrice" placeholder="Price">
            <button onclick="addPhoto()">Save</button>
        </div>

        <button onclick="location.reload()" style="background:#7f8c8d; width:100%; margin-bottom:50px;">Logout</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://prashant-haircut-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkPass() {
            if(document.getElementById('passInput').value === "123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadAdminData();
            } else { alert("Wrong!"); }
        }

        function updateNotice() {
            const msg = document.getElementById('annMsg').value;
            if(msg) { db.ref('announcement').set(msg); alert("Live ho gaya!"); }
        }
        function clearNotice() { db.ref('announcement').remove(); alert("Hata diya!"); }

        function updateSocial() {
            const tg = document.getElementById('sTelegram').value;
            const ig = document.getElementById('sInsta').value;
            const wa = document.getElementById('sWA').value;
            db.ref('social').set({ tg, ig, wa }); alert("Links Updated!");
        }

        function loadAdminData() {
            db.ref('bookings').on('value', snap => {
                const data = snap.val();
                const tbody = document.getElementById('bookBody');
                tbody.innerHTML = '';
                for(let id in data) {
                    tbody.innerHTML += `<tr><td><b>${data[id].name}</b> (${data[id].phone})<br><small>${data[id].time}</small><div class="note-box">${data[id].note || 'No note'}</div></td><td align="right"><button onclick="del('bookings/${id}')" style="background:#e74c3c; padding:6px; border-radius:4px; width:50px;">Done</button></td></tr>`;
                }
            });
        }

        function addPhoto() {
            const url = document.getElementById('pUrl').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            if(url && title && price) { db.ref('photos').push({url, title, price}); alert("Added!"); }
        }

        function del(path) { if(confirm("Confirm?")) db.ref(path).remove(); }
    </script>
</body>
</html>
