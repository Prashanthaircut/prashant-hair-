<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Prashant Hair Salon</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; margin-top: 5px; }
        .style-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
        img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body>

    <h2>Admin Panel</h2>

    <div class="card">
        <h3>Add New Style</h3>
        <input type="text" id="imgUrl" placeholder="Image URL">
        <input type="text" id="styleName" placeholder="Style Name">
        <input type="number" id="price" placeholder="Price">
        <button onclick="addStyle()">Save Style</button>
    </div>

    <div class="card">
        <h3>Manage Styles (Delete)</h3>
        <div id="styleList">Loading styles...</div>
    </div>

    <script>
        // TAMARA FIREBASE NI CONFIGURATION AHI NAKHJO (Jem pela hati)
        const firebaseConfig = {
            databaseURL: "https://prashant-hair-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Style Add karva mate
        function addStyle() {
            const url = document.getElementById('imgUrl').value;
            const name = document.getElementById('styleName').value;
            const price = document.getElementById('price').value;
            if(url && name && price) {
                db.ref('styles').push({ url, name, price });
                alert("Style added!");
            }
        }

        // Styles display karva ane delete button mookva mate
        db.ref('styles').on('value', (snapshot) => {
            const list = document.getElementById('styleList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="style-item">
                        <img src="${data.url}">
                        <span><b>${data.name}</b> - ₹${data.price}</span>
                        <button class="delete-btn" onclick="deleteStyle('${child.key}')">Delete</button>
                    </div>
                `;
            });
        });

        // Delete function
        function deleteStyle(key) {
            if(confirm("Are you sure you want to delete this?")) {
                db.ref('styles/' + key).remove();
            }
        }
    </script>
</body>
</html>
