<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Prashant Hair Salon</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        .save-btn { background: #28a745; }
        .delete-btn { background: #dc3545; width: auto; padding: 6px 12px; font-size: 13px; }
        .done-btn { background: #dc3545; width: auto; float: right; }
        .item { border-bottom: 1px solid #eee; padding: 15px 0; }
        img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
        .flex { display: flex; align-items: center; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>Admin Panel</h2>

    <div class="card">
        <h3>📢 Notification Bar</h3>
        <input type="text" id="noticeText" placeholder="Offer message likhein...">
        <button onclick="saveNotice()">Show on Website</button>
        <button style="background:#6c757d; margin-top:5px;" onclick="removeNotice()">Remove Notice</button>
    </div>

    <div class="card">
        <h3>🔗 Update Social Links</h3>
        <input type="text" id="tgLink" placeholder="Telegram Link">
        <input type="text" id="igLink" placeholder="Instagram Link">
        <input type="text" id="waLink" placeholder="WhatsApp (91...)">
        <button style="background:#00acee;" onclick="updateLinks()">Update Links</button>
    </div>

    <div class="card">
        <h3>📅 New Bookings</h3>
        <div id="bookingList">Loading bookings...</div>
    </div>

    <div class="card">
        <h3>✂️ Add New Style</h3>
        <input type="text" id="imgUrl" placeholder="Image URL">
        <input type="text" id="styleName" placeholder="Style Name">
        <input type="number" id="price" placeholder="Price">
        <button class="save-btn" onclick="addStyle()">Save Style</button>
    </div>

    <div class="card">
        <h3>🗑️ Manage Styles (Delete)</h3>
        <div id="styleList">Loading styles...</div>
    </div>

    <script>
        const firebaseConfig = { 
            databaseURL: "https://prashant-hair-default-rtdb.firebaseio.com/" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Functions
        function saveNotice() { db.ref('notice').set(document.getElementById('noticeText').value); alert("Updated!"); }
        function removeNotice() { db.ref('notice').remove(); alert("Removed!"); }
        
        function updateLinks() {
            db.ref('links').set({
                tg: document.getElementById('tgLink').value,
                ig: document.getElementById('igLink').value,
                wa: document.getElementById('waLink').value
            });
            alert("Links Updated!");
        }

        function addStyle() {
            const url = document.getElementById('imgUrl').value;
            const name = document.getElementById('styleName').value;
            const price = document.getElementById('price').value;
            if(url && name && price) {
                db.ref('styles').push({ url, name, price });
                alert("Style Saved!");
            }
        }

        // Load Bookings
        db.ref('bookings').on('value', (snap) => {
            const list = document.getElementById('bookingList');
            list.innerHTML = '';
            snap.forEach((child) => {
                const b = child.val();
                list.innerHTML += `<div class="item">
                    <b>${b.name}</b> (${b.phone})<br>
                    <i style="background:#fff9c4;">${b.message}</i>
                    <button class="done-btn" onclick="del('bookings/${child.key}')">Done</button>
                    <div style="clear:both;"></div>
                </div>`;
            });
        });

        // Load Styles for Delete
        db.ref('styles').on('value', (snap) => {
            const list = document.getElementById('styleList');
            list.innerHTML = '';
            snap.forEach((child) => {
                const data = child.val();
                list.innerHTML += `<div class="item flex">
                    <div style="display:flex; align-items:center;">
                        <img src="${data.url}">
                        <div style="margin-left:10px;"><b>${data.name}</b><br>₹${data.price}</div>
                    </div>
                    <button class="delete-btn" onclick="del('styles/${child.key}')">Delete</button>
                </div>`;
            });
        });

        function del(path) { if(confirm("Are you sure?")) db.ref(path).remove(); }
    </script>
</body>
</html>
