<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Admin - Prashant Hair Salon</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f4f8; margin: 0; padding: 10px; }
        #loginBox { background: white; padding: 30px; border-radius: 12px; text-align: center; margin-top: 50px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 300px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-top: 4px solid #d4af37; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top:5px; }
        
        /* Booking Details Style */
        .booking-item { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .booking-info b { color: #d4af37; font-size: 16px; }
        .booking-info p { margin: 4px 0; font-size: 14px; color: #333; }
        .note-box { background: #fff9c4; padding: 8px; border-radius: 6px; font-size: 13px; border-left: 3px solid #fbc02d; margin-top: 5px; }
        
        .del-btn { background: #e74c3c; padding: 8px 15px; border-radius: 6px; width: auto; float: right; }
        .status-open { background: #28a745; }
        .status-closed { background: #e74c3c; }
        .flex { display: flex; align-items: center; justify-content: space-between; }
        img { width: 50px; height: 50px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body>

    <div id="loginBox">
        <h3>Admin Entry</h3>
        <input type="password" id="passInput" placeholder="Enter Password">
        <button onclick="checkPass()" style="background:#d4af37;">Login</button>
    </div>

    <div id="mainContent" style="display:none;">
        <h2 style="text-align:center;">Admin Control</h2>

        <div class="card" style="border-top-color: #000;">
            <h3>🏪 Shop Status</h3>
            <div id="displayStatus" style="text-align:center; font-weight:bold; margin-bottom:10px; font-size:18px;">Checking...</div>
            <button onclick="setStatus('Open')" class="status-open">SET OPEN (Green)</button>
            <button onclick="setStatus('Closed')" class="status-closed">SET CLOSED (Red)</button>
        </div>

        <div class="card" style="border-top-color: #ff9800;">
            <h3>📢 Notification Bar</h3>
            <input type="text" id="annMsg" placeholder="Offer ya Message likhein...">
            <button onclick="updateNotice()" style="background:#ff9800;">Show on Website</button>
            <button onclick="clearNotice()" style="background:#666;">Remove Notice</button>
        </div>

        <div class="card" style="border-top-color: #3498db;">
            <h3>📅 New Bookings</h3>
            <div id="bookBody">Loading bookings...</div>
        </div>

        <div class="card" style="border-top-color: #27ae60;">
            <h3>✂️ Add Style</h3>
            <input type="text" id="pUrl" placeholder="Image URL">
            <input type="text" id="pTitle" placeholder="Style Name">
            <input type="number" id="pPrice" placeholder="Price">
            <button onclick="addPhoto()" style="background:#27ae60;">Save Style</button>
        </div>

        <div class="card" style="border-top-color: #e74c3c;">
            <h3>🗑️ Delete Styles</h3>
            <div id="styleList">Loading styles...</div>
        </div>

        <button onclick="location.reload()" style="background:#7f8c8d; width:100%; margin-bottom:50px;">Logout</button>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://prashant-haircut-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkPass() {
            if(document.getElementById('passInput').value === "123") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                loadAdminData();
            } else { alert("Wrong Password!"); }
        }

        // Notification Functions
        function updateNotice() { db.ref('announcement').set(document.getElementById('annMsg').value); alert("Live Updated!"); }
        function clearNotice() { db.ref('announcement').remove(); alert("Notice Removed!"); }

        // Shop Status
        function setStatus(s) { db.ref('shopStatus').set(s); alert("Shop status changed to " + s); }

        db.ref('shopStatus').on('value', snap => {
            const s = snap.val() || "Open";
            const el = document.getElementById('displayStatus');
            el.innerText = "Current: " + s.toUpperCase();
            el.style.color = (s === 'Open') ? '#28a745' : '#e74c3c';
        });

        function loadAdminData() {
            // Load Bookings with Full Details
            db.ref('bookings').on('value', snap => {
                const data = snap.val();
                const container = document.getElementById('bookBody');
                container.innerHTML = '';
                if(!data) { container.innerHTML = 'No bookings found.'; return; }
                for(let id in data) {
                    container.innerHTML += `
                        <div class="booking-item">
                            <button onclick="del('bookings/${id}')" class="del-btn">Done</button>
                            <div class="booking-info">
                                <b>👤 ${data[id].name}</b>
                                <p>📞 ${data[id].phone}</p>
                                <p>⏰ ${data[id].time ? data[id].time.replace('T', ' ') : 'N/A'}</p>
                                ${data[id].note ? `<div class="note-box">📝 ${data[id].note}</div>` : ''}
                            </div>
                            <div style="clear:both;"></div>
                        </div>`;
                }
            });

            // Load Styles
            db.ref('photos').on('value', snap => {
                const data = snap.val();
                const list = document.getElementById('styleList');
                list.innerHTML = '';
                for(let id in data) {
                    list.innerHTML += `<div class="flex" style="padding:10px 0; border-bottom:1px solid #eee;">
                        <div style="display:flex; align-items:center;">
                            <img src="${data[id].url}">
                            <span style="margin-left:10px;">${data[id].title}</span>
                        </div>
                        <button onclick="del('photos/${id}')" class="del-btn" style="background:#e74c3c;">Delete</button>
                    </div>`;
                }
            });
        }

        function addPhoto() {
            const url = document.getElementById('pUrl').value;
            const title = document.getElementById('pTitle').value;
            const price = document.getElementById('pPrice').value;
            if(url && title && price) { db.ref('photos').push({url, title, price}); alert("Added!"); }
        }

        function del(path) { if(confirm("Are you sure?")) db.ref(path).remove(); }
    </script>
</body>
</html>
